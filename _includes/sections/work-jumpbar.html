<style type="text/css">
    /* Sticky jump bar for /work, styled like the timeline's year strip. */
    .work-jumpbar {
        position: sticky;
        top: 0;
        z-index: 10;
        margin: 0 -1rem 2rem;
        padding: 0 1rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.14);
        background-color: #111418;
    }

    .work-jumpbar ol {
        display: flex;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
    }

    .work-jumpbar li {
        margin: 0;
    }

    .work-jumpbar a {
        display: block;
        padding: 0.75rem 0.6rem;
        color: #7a8597;
        font-weight: 700;
        text-decoration: none;
        transition: color 0.2s;
    }

    .work-jumpbar a[aria-current="true"] {
        color: #e8e8e8;
        box-shadow: inset 0 -2px 0 #61B3AF;
    }

    @media (hover: hover) {
        .work-jumpbar a:hover {
            color: #e8e8e8;
        }
    }

    /* Land section headings below the bar. */
    #case-studies,
    #gallery,
    .work-index-section {
        scroll-margin-top: 64px;
    }

    @media (prefers-reduced-motion: reduce) {
        .work-jumpbar a {
            transition: none;
        }
    }
</style>
<nav class="work-jumpbar" aria-label="Work sections">
    <ol>
        <li><a href="#gallery" data-no-swup>Gallery</a></li>
        <li><a href="#case-studies" data-no-swup>Case studies</a></li>
        <li><a href="#index" data-no-swup>Index</a></li>
    </ol>
</nav>
<script>
    (function () {
        var bar = document.querySelector(".work-jumpbar");
        if (!bar) return;
        var links = [].slice.call(bar.querySelectorAll("a"));

        // The current section is the last one whose top has passed under the bar.
        function update() {
            if (!bar.isConnected) {
                window.removeEventListener("scroll", update);
                return;
            }
            // Look sections up each time: they come after the bar in the page.
            var targets = links.map(function (a) { return document.querySelector(a.getAttribute("href")); });
            var line = bar.getBoundingClientRect().bottom + 16;
            var current = -1, best = -Infinity;
            targets.forEach(function (el, i) {
                if (!el) return;
                var top = el.getBoundingClientRect().top;
                if (top <= line && top > best) { best = top; current = i; }
            });
            links.forEach(function (a, i) {
                if (i === current) a.setAttribute("aria-current", "true");
                else a.removeAttribute("aria-current");
            });
        }
        window.addEventListener("scroll", update, { passive: true });
        document.addEventListener("DOMContentLoaded", update);
        update();
    })();
</script>
