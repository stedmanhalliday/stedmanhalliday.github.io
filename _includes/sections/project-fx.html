<style type="text/css">
    /* Window light: a soft accent light follows the pointer across each project row,
       a highlight tracks it on the thumbnail, and the image drifts with scroll. */
    .post-list.projects .project {
        position: relative;
        isolation: isolate;
    }

    /* The light spills softly past each row; clip only at the page edges so it never
       causes horizontal scroll. overflow-x: clip keeps sticky elements working. */
    main:has(.post-list.projects) {
        overflow-x: clip;
    }

    .post-list.projects .project::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        z-index: -1;
        pointer-events: none;
        width: 32rem;
        height: 32rem;
        margin: -16rem 0 0 -16rem;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(97, 179, 175, 0.12), rgba(97, 179, 175, 0));
        translate: var(--mx, 0px) var(--my, 0px);
        opacity: 0;
        transition: opacity 0.35s ease;
    }

    .post-list.projects .thumbnail {
        position: relative;
    }

    .post-list.projects .thumbnail::after {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        pointer-events: none;
        width: 20rem;
        height: 20rem;
        margin: -10rem 0 0 -10rem;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0));
        translate: var(--sx, 0px) var(--sy, 0px);
        opacity: 0;
        transition: opacity 0.35s ease;
    }

    .post-list.projects .project.is-lit::before,
    .post-list.projects .project.is-lit .thumbnail::after {
        opacity: 1;
    }

    /* Keyboard: the same light, parked, plus a ring on the frame. */
    .post-list.projects .project:has(:focus-visible)::before {
        opacity: 1;
        translate: none;
        left: 30%;
        top: 50%;
    }

    .post-list.projects .project:has(:focus-visible) .thumbnail::after {
        opacity: 0.7;
        translate: none;
        left: 35%;
        top: 30%;
    }

    .post-list.projects .project:has(.thumbnail a:focus-visible) .thumbnail {
        outline: 2px solid #61B3AF;
        outline-offset: 4px;
    }

    @keyframes project-drift {
        from { translate: 0 -1.2%; }
        to { translate: 0 1.2%; }
    }

    @media (prefers-reduced-motion: no-preference) {
        .post-list.projects.fx-pointer .thumbnail img {
            scale: 1.03;
            transform: translate(calc((var(--tx, 0.5) - 0.5) * -6px), calc((var(--ty, 0.5) - 0.5) * -6px));
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @supports (animation-timeline: view()) {
            .post-list.projects .thumbnail img {
                scale: 1.03;
                animation: project-drift linear both;
                animation-timeline: view();
            }
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .post-list.projects .project::before,
        .post-list.projects .thumbnail::after {
            transition: none;
        }

        .post-list.projects .project:hover::before {
            opacity: 1;
            translate: none;
            left: 30%;
            top: 50%;
        }
    }
</style>
<script>
    (function () {
        var lists = document.querySelectorAll(".post-list.projects:not([data-fx])");
        if (!lists.length) return;
        lists.forEach(function (list) { list.setAttribute("data-fx", ""); });
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        // Touch and coarse pointers get the CSS scroll drift only.
        if (!window.matchMedia("(hover: hover) and (pointer: fine)").matches) return;

        lists.forEach(function (list) {
            list.classList.add("fx-pointer");
            list.querySelectorAll(".project").forEach(function (card) {
                var thumb = card.querySelector(".thumbnail");
                if (!thumb) return;
                var x = 0, y = 0, raf = 0;

                function frame() {
                    raf = 0;
                    if (!card.isConnected) return;
                    // Read both rects first, then write, to avoid layout thrash.
                    var r = card.getBoundingClientRect();
                    var t = thumb.getBoundingClientRect();
                    var tx = Math.min(1, Math.max(0, (x - t.left) / t.width));
                    var ty = Math.min(1, Math.max(0, (y - t.top) / t.height));
                    var s = card.style;
                    s.setProperty("--mx", (x - r.left) + "px");
                    s.setProperty("--my", (y - r.top) + "px");
                    s.setProperty("--sx", (x - t.left) + "px");
                    s.setProperty("--sy", (y - t.top) + "px");
                    s.setProperty("--tx", tx.toFixed(3));
                    s.setProperty("--ty", ty.toFixed(3));
                }
                card.addEventListener("pointerenter", function (e) {
                    x = e.clientX; y = e.clientY;
                    frame(); // place the light before it fades in
                    card.classList.add("is-lit");
                });
                card.addEventListener("pointermove", function (e) {
                    x = e.clientX; y = e.clientY;
                    if (!raf) raf = window.requestAnimationFrame(frame);
                });
                card.addEventListener("pointerleave", function () {
                    if (raf) { window.cancelAnimationFrame(raf); raf = 0; }
                    card.classList.remove("is-lit");
                    card.style.removeProperty("--tx"); // image eases back to center
                    card.style.removeProperty("--ty");
                });
            });
        });
    })();
</script>
