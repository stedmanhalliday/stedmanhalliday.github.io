<style type="text/css">
    /* Cover flow: a full-bleed scroll-snap row. The centered frame sits flat; neighbors
       tilt away. Tilt is a scroll-driven animation, so it degrades to a flat row. */
    main:has(.reel) {
        overflow-x: clip;
    }

    /* Frames share a height and keep their own aspect ratio (--ar), so nothing crops. */
    .reel {
        --reel-h: min(40vw, 420px);
        --reel-dim: #7a8597;
        margin: 0 calc(50% - 50vw);
    }

    .reel-track {
        display: flex;
        gap: clamp(8px, 2vw, 24px);
        margin: 0;
        padding: 24px 0;
        list-style: none;
        overflow-x: auto;
        overscroll-behavior-x: contain;
        scroll-snap-type: x mandatory;
        scrollbar-width: none;
    }

    .reel-track::-webkit-scrollbar {
        display: none;
    }

    .reel-track:focus-visible {
        outline: 2px solid rgba(97, 179, 175, 0.7);
        outline-offset: -2px;
    }

    .reel-item {
        flex: 0 0 calc(var(--reel-h) * var(--ar));
        margin: 0;
        scroll-snap-align: center;
        view-timeline: --reel-item inline;
    }

    /* The end frames can still reach the center. */
    .reel-item:first-child {
        margin-inline-start: calc(50vw - var(--reel-h) * var(--ar) / 2);
    }

    .reel-item:last-child {
        margin-inline-end: calc(50vw - var(--reel-h) * var(--ar) / 2);
    }

    .reel-item a {
        position: relative;
        display: block;
        height: var(--reel-h);
        overflow: hidden;
        border-radius: 8px;
        background-color: #0d0f12;
        box-shadow: 0 24px 48px -24px rgba(0, 0, 0, 0.8);
    }

    .reel-item img {
        display: block;
        width: 100%;
        height: 100%;
    }

    @supports (animation-timeline: view()) {
        @media (prefers-reduced-motion: no-preference) {
            .reel-item a {
                animation: reel-tilt linear both;
                animation-timeline: --reel-item;
            }
        }
    }

    /* 0% = entering from the right edge, 50% = centered, 100% = leaving on the left.
       Neighbors slide toward the center so they tuck behind it, and the center stacks on top. */
    @keyframes reel-tilt {
        0% {
            z-index: 0;
            transform: perspective(1200px) translateX(-34%) rotateY(-42deg) scale(0.74);
            filter: brightness(0.4);
        }
        50% {
            z-index: 10;
            transform: perspective(1200px) translateX(0) rotateY(0) scale(1);
            filter: brightness(1);
        }
        100% {
            z-index: 0;
            transform: perspective(1200px) translateX(34%) rotateY(42deg) scale(0.74);
            filter: brightness(0.4);
        }
    }

    .reel-bar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        margin: 8px auto 0;
        padding: 0 1rem;
    }

    .reel-caption {
        min-height: 1.5em;
        margin: 8px 0 0;
        text-align: center;
        color: var(--reel-dim);
    }

    .reel-nav {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 50%;
        background: none;
        color: #e8e8e8;
        cursor: pointer;
    }

    .reel-nav:disabled {
        opacity: 0.35;
        cursor: default;
    }

    .reel-dots {
        display: flex;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
    }

    .reel-dots li {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: rgba(255, 255, 255, 0.2);
        transition: background-color 0.2s;
    }

    .reel-dots li[aria-current="true"] {
        background-color: #61B3AF;
    }

    @media (hover: hover) {
        .reel-nav:not(:disabled):hover {
            border-color: #61B3AF;
            color: #61B3AF;
        }
    }

    @media screen and (max-width: 600px) {
        .reel {
            --reel-h: 46vw;
        }
    }
</style>
<div class="reel">
    <ul class="reel-track" tabindex="0" aria-label="Highlights reel, scrolls sideways">
        {% for frame in site.data.reel %}
        <li class="reel-item" style="--ar: {{ frame.width | times: 1.0 | divided_by: frame.height | round: 4 }}" data-caption="{{ frame.caption | escape }}">
            <a href="{{ '/assorted-works' | relative_url }}#{{ frame.anchor }}">
                <img src="{{ frame.image | relative_url }}" alt="{{ frame.caption | escape }}" width="{{ frame.width }}" height="{{ frame.height }}" loading="lazy" decoding="async">
            </a>
        </li>
        {% endfor %}
    </ul>
    <div class="reel-bar">
        <button class="reel-nav" type="button" data-dir="-1" aria-label="Previous">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <ol class="reel-dots" aria-hidden="true">
            {% for frame in site.data.reel %}<li></li>{% endfor %}
        </ol>
        <button class="reel-nav" type="button" data-dir="1" aria-label="Next">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
    </div>
    <p class="reel-caption" aria-live="polite"></p>
</div>
<script>
    (function () {
        var root = document.querySelector(".reel");
        if (!root) return;
        var track = root.querySelector(".reel-track");
        var items = [].slice.call(track.querySelectorAll(".reel-item"));
        var dots = [].slice.call(root.querySelectorAll(".reel-dots li"));
        var prev = root.querySelector('[data-dir="-1"]');
        var next = root.querySelector('[data-dir="1"]');
        var caption = root.querySelector(".reel-caption");
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var current = -1;
        var target = null;

        function setCurrent(index) {
            if (index === current) return;
            current = index;
            dots.forEach(function (d, i) {
                if (i === index) d.setAttribute("aria-current", "true");
                else d.removeAttribute("aria-current");
            });
            caption.textContent = items[index].dataset.caption;
            prev.disabled = index === 0;
            next.disabled = index === items.length - 1;
        }

        // The frame nearest the track's center is current.
        function update() {
            var mid = track.getBoundingClientRect().left + track.clientWidth / 2;
            var best = 0, bestDist = Infinity;
            items.forEach(function (el, i) {
                var r = el.getBoundingClientRect();
                var d = Math.abs(r.left + r.width / 2 - mid);
                if (d < bestDist) { bestDist = d; best = i; }
            });
            setCurrent(best);
            if (best === target) target = null;
        }

        function go(index) {
            target = Math.max(0, Math.min(items.length - 1, index));
            var r = items[target].getBoundingClientRect();
            var t = track.getBoundingClientRect();
            track.scrollTo({
                left: track.scrollLeft + (r.left + r.width / 2) - (t.left + track.clientWidth / 2),
                behavior: reduce ? "auto" : "smooth"
            });
        }

        [prev, next].forEach(function (btn) {
            // Rapid clicks step from the frame already on its way in, not the one leaving.
            btn.addEventListener("click", function () {
                go((target === null ? current : target) + Number(btn.dataset.dir));
            });
        });
        track.addEventListener("scroll", update, { passive: true });
        update();
    })();
</script>
