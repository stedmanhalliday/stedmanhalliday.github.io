<section class="featured-work">
<div class="wrapper">
    <h1 class="page-heading center text-center">Featured Work</h1>
</div>
<ul class="post-list projects featured-cards grid col3">
    {% for featured_title in site.data.works.featured %}
    {% assign card = site.projects | where: "title", featured_title | first %}
    <li class="project">
        <div class="thumbnail">
            <a href="{{ card.url | relative_url }}"><img src="{{ card.image }}" alt="{{ card.title }}" /></a>
        </div>
        <h3>
            <a class="post-link" href="{{ card.url | relative_url }}">{{ card.title | escape }}</a>
        </h3>
        <div class="post-description">{{ card.description | markdownify }}</div>
    </li>
    {% endfor %}
</ul>
</section>
